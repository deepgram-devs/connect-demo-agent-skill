                  "status": "processing",
                  "prescriptions": [{"rx_id": "RX1005", "name": "Metformin 500mg", "quantity": 60, "refills_remaining": 0}],
                  "timing": {"ready_at": None, "shipped_at": None, "delivered_at": None, "expected_pickup_time": "2025-12-21T09:30", "expected_delivery_time": None},
                  "pharmacy": {"store_id": "SPR-003", "hours": {"weekday_hours": "8AM-8PM", "weekend_hours": "8AM-5PM"}},
              },
              {
                  "order_id": "ORD006",
                  "member_id": "M1006",
                  "status": "ready_for_pickup",
                  "prescriptions": [{"rx_id": "RX1006", "name": "Losartan 25mg", "quantity": 30, "refills_remaining": 2}],
                  "timing": {"ready_at": "2025-12-07T14:10", "shipped_at": None, "delivered_at": None, "expected_pickup_time": "2025-12-09T19:30", "expected_delivery_time": None},
                  "pharmacy": {"store_id": "SPR-003", "hours": {"weekday_hours": "8AM-8PM", "weekend_hours": "8AM-5PM"}},
              },
              {
                  "order_id": "ORD007",
                  "member_id": "M1007",
                  "status": "shipped",
                  "prescriptions": [{"rx_id": "RX1007", "name": "Levothyroxine 75mcg", "quantity": 30, "refills_remaining": 3}],
                  "timing": {"ready_at": None, "shipped_at": "2025-11-26T16:20:00", "delivered_at": None, "expected_pickup_time": None, "expected_delivery_time": "2025-12-09T10:30:00"},
                  "pharmacy": {"store_id": "SPR-004", "hours": {"weekday_hours": "8AM-8PM", "weekend_hours": "8AM-5PM"}},
              },
              {
                  "order_id": "ORD008",
                  "member_id": "M1008",
                  "status": "delivered",
                  "prescriptions": [{"rx_id": "RX1008", "name": "Amlodipine 5mg", "quantity": 30, "refills_remaining": 1}],
                  "timing": {"ready_at": None, "shipped_at": "2025-11-29T13:00:00", "delivered_at": "2025-12-12T09:25", "expected_pickup_time": None, "expected_delivery_time": None},
                  "pharmacy": {"store_id": "SPR-004", "hours": {"weekday_hours": "8AM-8PM", "weekend_hours": "8AM-5PM"}},
              },
          ]

          def lambda_handler(event, context):
              try:
                  if "customerId" not in event:
                      return {"error": "customerId field is required"}
                  customer_id = event["customerId"]
                  matching = [o for o in ORDERS if o["member_id"] == customer_id]
                  return {"orders": matching}
              except Exception:
                  return {"error": "Internal server error"}
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 10
      MemorySize: 128

  GatewayLambdaInvokePolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: AgentCoreGatewayLambdaInvoke
      Roles:
        - !Ref AgentCoreGatewayRoleName
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AmazonBedrockAgentCoreGatewayLambdaInvoke
            Effect: Allow
            Action:
              - lambda:InvokeFunction
            Resource:
              - !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:*

Outputs:
  AuthenticateUserFunctionArn:
    Description: ARN of the authenticate_user Lambda
    Value: !GetAtt AuthenticateUserFunction.Arn
  GetPrescriptionsFunctionArn:
    Description: ARN of the get_prescriptions Lambda
    Value: !GetAtt GetPrescriptionsFunction.Arn
  LambdaExecutionRoleArn:
    Description: ARN of the shared Lambda execution role
    Value: !GetAtt LambdaExecutionRole.Arn