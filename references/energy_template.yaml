AWSTemplateFormatVersion: '2010-09-09'
Description: Summit Energy Lambda APIs - account_lookup, usage_history, and create_payment_plan

Parameters:
  AgentCoreGatewayRoleName:
    Type: String
    Description: The name of the AgentCore Gateway service role

Resources:
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: Energy-LambdaExecutionRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  AccountLookupFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: energy_account_lookup
      Runtime: python3.12
      Handler: index.lambda_handler
      Code:
        ZipFile: |
          import traceback

          ACCOUNTS = {
              ("Maria Chen", "SE-441928"): {
                  "account_number": "SE-441928",
                  "name": "Maria Chen",
                  "address": "2847 Maple Ridge Dr, Denver, CO 80220",
                  "plan": "Residential Standard",
                  "current_balance": 187.43,
                  "due_date": "2026-04-05",
                  "payment_status": "unpaid",
                  "autopay": False,
              },
              ("James Whitfield", "SE-557012"): {
                  "account_number": "SE-557012",
                  "name": "James Whitfield",
                  "address": "910 Elk Meadow Ln, Aurora, CO 80015",
                  "plan": "Residential Time-of-Use",
                  "current_balance": 0.00,
                  "due_date": "2026-04-12",
                  "payment_status": "paid",
                  "autopay": True,
              },
              ("Rosa Gutierrez", "SE-338471"): {
                  "account_number": "SE-338471",
                  "name": "Rosa Gutierrez",
                  "address": "1523 Cottonwood St, Lakewood, CO 80226",
                  "plan": "Residential Standard",
                  "current_balance": 142.67,
                  "due_date": "2026-04-08",
                  "payment_status": "unpaid",
                  "autopay": False,
              },
              ("David Park", "SE-662190"): {
                  "account_number": "SE-662190",
                  "name": "David Park",
                  "address": "4401 Summit Blvd, Boulder, CO 80301",
                  "plan": "Residential Time-of-Use",
                  "current_balance": 95.20,
                  "due_date": "2026-04-15",
                  "payment_status": "unpaid",
                  "autopay": False,
              },
              ("Linda Thompson", "SE-774835"): {
                  "account_number": "SE-774835",
                  "name": "Linda Thompson",
                  "address": "782 Spruce Way, Arvada, CO 80004",
                  "plan": "Residential Standard",
                  "current_balance": 0.00,
                  "due_date": "2026-04-10",
                  "payment_status": "paid",
                  "autopay": True,
              },
          }

          def lambda_handler(event, context):
              try:
                  if "name" not in event:
                      return {"error": "name field is required"}
                  if "account_number" not in event:
                      return {"error": "account_number field is required"}
                  name = event["name"]
                  account_number = event["account_number"]
                  account = ACCOUNTS.get((name, account_number))
                  if account:
                      return account
                  return {"error": "Account not found. Please verify your name and account number."}
              except Exception:
                  traceback.print_exc()
                  return {"error": "Internal server error"}
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 10
      MemorySize: 128

