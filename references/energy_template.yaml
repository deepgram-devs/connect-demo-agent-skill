  CreatePaymentPlanFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: energy_create_payment_plan
      Runtime: python3.12
      Handler: index.lambda_handler
      Code:
        ZipFile: |
          import random
          import string

          BALANCES = {
              "SE-441928": {"balance": 187.43, "due_date": "2026-04-05"},
              "SE-557012": {"balance": 0.00, "due_date": "2026-04-12"},
              "SE-338471": {"balance": 142.67, "due_date": "2026-04-08"},
              "SE-662190": {"balance": 95.20, "due_date": "2026-04-15"},
              "SE-774835": {"balance": 0.00, "due_date": "2026-04-10"},
          }

          def lambda_handler(event, context):
              try:
                  if "account_number" not in event:
                      return {"error": "account_number field is required"}
                  if "installments" not in event:
                      return {"error": "installments field is required"}

                  account_number = event["account_number"]
                  installments = int(event["installments"])
                  first_payment_date = event.get("first_payment_date")

                  account = BALANCES.get(account_number)
                  if not account:
                      return {"error": "Account not found."}

                  balance = account["balance"]
                  if balance <= 0:
                      return {"error": "No outstanding balance on this account."}

                  if installments < 2 or installments > 12:
                      return {"error": "Installments must be between 2 and 12."}

                  monthly_payment = round(balance / installments, 2)
                  if not first_payment_date:
                      first_payment_date = account["due_date"]

                  plan_id = "PP-" + "".join(random.choices(string.digits, k=5))

                  return {
                      "plan_id": plan_id,
                      "account_number": account_number,
                      "total_balance": balance,
                      "monthly_payment": monthly_payment,
                      "installments": installments,
                      "first_payment_date": first_payment_date,
                      "confirmation": f"Payment plan {plan_id} created. {installments} monthly payments of ${monthly_payment:.2f} starting {first_payment_date}.",
                  }
              except Exception:
                  return {"error": "Internal server error"}
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 10
      MemorySize: 128

  GatewayLambdaInvokePolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: AgentCoreGatewayLambdaInvoke-Energy
      Roles:
        - !Ref AgentCoreGatewayRoleName
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AmazonBedrockAgentCoreGatewayLambdaInvoke
            Effect: Allow
            Action:
              - lambda:InvokeFunction
            Resource:
              - !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:*

Outputs:
  AccountLookupFunctionArn:
    Description: ARN of the account_lookup Lambda
    Value: !GetAtt AccountLookupFunction.Arn
  UsageHistoryFunctionArn:
    Description: ARN of the usage_history Lambda
    Value: !GetAtt UsageHistoryFunction.Arn
  CreatePaymentPlanFunctionArn:
    Description: ARN of the create_payment_plan Lambda
    Value: !GetAtt CreatePaymentPlanFunction.Arn
  LambdaExecutionRoleArn:
    Description: ARN of the shared Lambda execution role
    Value: !GetAtt LambdaExecutionRole.Arn
